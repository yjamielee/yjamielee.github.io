<div class="honors">
  <h2 id="honors-title" class="honors-title">
    <i class="fas fa-award"></i> Honors
  </h2>
  <div class="honors-body">
    {% assign hs = site.data.honors | sort: "year" | reverse %}
    {% for h in hs %}
      <article class="honor-card">
        <div class="honor-meta">
          <span class="honor-title"><strong>{{ h.title }}</strong></span>
          <span class="honor-year">[{{ h.year }}]</span>
        </div>
        {% if h.detail %}
          <p class="honor-detail">{{ h.detail }}</p>
        {% endif %}
      </article>
    {% endfor %}
  </div>
</div>
