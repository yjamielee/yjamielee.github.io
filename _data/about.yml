- title: "About Me"
  detail: |
    I am an MS student in Biostatistics and Data Science at **UTHealth Houston**, with a clinical nursing background and research experience in digital health, clinical AI, and healthcare data analytics. Across clinical practice, academic research, and healthcare technology, I have developed a strong interest in using data to generate reliable evidence for clinical decision-making and patient outcomes.

    My current interests lie at the intersection of clinical research, healthcare data, and life sciences. I am especially interested in evidence generation, clinical data management, pharmacovigilance, clinical trial and research operations, and statistical programming.
