- title: "About Me"
  detail: |
    I am a Master’s student in Biostatistics and Data Science at the **University of Texas Health Science Center at Houston**, where I focus on applying statistical modeling and data science to complex problems in healthcare. My academic journey began with a Bachelor and Master of Science in Nursing at **Yonsei University**.
    
    Professionally, I have worked at **AITRICS** in Seoul as both a Clinical Research Manager and Medical Writer, contributing to the development of AI-driven clinical decision support systems (AI-CDSS). In these roles, I integrated electronic health record data with predictive algorithms, conducted multivariate and statistical analyses in R, and designed study protocols for post-approval SaMD trials. I also built SQL-based data management systems and authored a grant proposal that secured $150,000 for digital healthcare research.

    Earlier, as a Graduate Research Assistant at **Yonsei University**, I participated in nationally funded projects on HIV care and mobile health interventions. My work included psychometric validation, multivariate modeling, and integrative reviews, which resulted in multiple peer-reviewed publications on HIV self-management, e-health literacy, and health-related quality of life. Prior to graduate research, I trained as a registered nurse at **Severance Hospital**, where I supported surgical procedures and contributed to a quality improvement project on pressure ulcer prevention.

    My research interests center on bridging clinical expertise with data-driven methodologies—developing scalable statistical pipelines, applying machine learning in healthcare, and advancing reproducible analytics for clinical research and digital health innovation.