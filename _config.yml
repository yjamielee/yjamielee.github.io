# The Site Configuration

# Import the theme
theme: jekyll-theme-chirpy

# Language
lang: en
timezone: America/Chicago

# ----- Site Meta -----
title: "Youngjin (Jamie) Lee"
tagline: "MS Student in Biostatistics & Data Science · RN, MSN"
description: "MS Student in Biostatistics & Data Science · RN, MSN"

# Fill in the protocol & hostname for your site.
url: ""

github:
  username: yjamielee

social:
  name: Youngjin (Jamie) Lee
  email: yjlee9503@gmail.com
  links:
    - https://github.com/yjamielee
    - https://www.linkedin.com/in/youngjinlee03

# ----- SEO -----
webmaster_verifications:
  google:
  bing:
  alexa:
  yandex:
  baidu:
  facebook:

# ----- Analytics -----
analytics:
  google:
    id:
  goatcounter:
    id:
  umami:
    id:
    domain:
  matomo:
    id:
    domain:
  cloudflare:
    id:
  fathom:
    id:

# Page views
pageviews:
  provider:

# Theme color mode (light | dark)
theme_mode:

# CDN endpoint (optional)
cdn:

# Avatar in sidebar
avatar: "/assets/image/profile.jpeg"

# Social preview image
social_preview_image:

# Table of contents
toc: true

# Comments
comments:
  provider:
  disqus:
    shortname:
  utterances:
    repo:
    issue_term:
  giscus:
    repo:
    repo_id:
    category:
    category_id:

# Assets self-hosting
assets:
  self_host:
    enabled:
    env:

# PWA
pwa:
  enabled: false
  cache:
    enabled: false
    deny_paths:

paginate: 10

# ----- Internal settings -----
baseurl: ""

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
